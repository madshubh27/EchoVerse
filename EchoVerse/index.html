<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EchoVerse — Voice Intelligence, Refined</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        /* ── Reset ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        /* ── Stars Canvas bg ── */
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #040a14;
            color: #d0dff0;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Deep space background with nebula glow */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 55% 65% at 72% 18%, rgba(24, 80, 160, 0.22) 0%, transparent 70%),
                radial-gradient(ellipse 40% 40% at 85% 10%, rgba(10, 50, 120, 0.18) 0%, transparent 60%),
                radial-gradient(ellipse 60% 80% at 50% 50%, #040f1e 0%, #020810 100%);
            z-index: 0;
        }

        /* Starfield */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 10% 15%, rgba(255, 255, 255, .55) 0%, transparent 100%),
                radial-gradient(1px 1px at 25% 8%, rgba(255, 255, 255, .4) 0%, transparent 100%),
                radial-gradient(1px 1px at 40% 22%, rgba(255, 255, 255, .6) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 55% 5%, rgba(255, 255, 255, .5) 0%, transparent 100%),
                radial-gradient(1px 1px at 70% 30%, rgba(255, 255, 255, .35) 0%, transparent 100%),
                radial-gradient(1px 1px at 85% 12%, rgba(255, 255, 255, .45) 0%, transparent 100%),
                radial-gradient(1px 1px at 92% 40%, rgba(255, 255, 255, .3) 0%, transparent 100%),
                radial-gradient(1px 1px at 15% 45%, rgba(255, 255, 255, .4) 0%, transparent 100%),
                radial-gradient(1px 1px at 30% 60%, rgba(255, 255, 255, .3) 0%, transparent 100%),
                radial-gradient(1px 1px at 60% 55%, rgba(255, 255, 255, .25) 0%, transparent 100%),
                radial-gradient(1px 1px at 5% 70%, rgba(255, 255, 255, .35) 0%, transparent 100%),
                radial-gradient(1px 1px at 78% 65%, rgba(255, 255, 255, .3) 0%, transparent 100%),
                radial-gradient(1px 1px at 45% 80%, rgba(255, 255, 255, .25) 0%, transparent 100%),
                radial-gradient(1px 1px at 20% 85%, rgba(255, 255, 255, .2) 0%, transparent 100%),
                radial-gradient(1px 1px at 90% 75%, rgba(255, 255, 255, .3) 0%, transparent 100%),
                radial-gradient(1px 1px at 35% 90%, rgba(255, 255, 255, .2) 0%, transparent 100%),
                radial-gradient(1px 1px at 65% 95%, rgba(255, 255, 255, .25) 0%, transparent 100%),
                radial-gradient(1px 1px at 50% 42%, rgba(255, 255, 255, .3) 0%, transparent 100%),
                radial-gradient(1px 1px at 8% 30%, rgba(255, 255, 255, .4) 0%, transparent 100%),
                radial-gradient(1px 1px at 95% 50%, rgba(255, 255, 255, .35) 0%, transparent 100%);
            z-index: 0;
        }

        /* ── Layout wrapper ── */
        .wrapper {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
        }

        /* ── Header bar ── */
        header {
            width: 100%;
            max-width: 680px;
            margin-top: 24px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(70, 130, 220, 0.2);
            border-radius: 10px;
            background: rgba(6, 18, 42, 0.55);
            backdrop-filter: blur(12px);
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: .72rem;
            font-weight: 600;
            letter-spacing: .16em;
            color: #a8c8e8;
            text-transform: uppercase;
        }

        .header-logo svg {
            width: 15px;
            height: 15px;
            color: #6ca0d4;
        }

        .header-ver {
            font-size: .72rem;
            color: rgba(168, 200, 232, 0.55);
            letter-spacing: .05em;
        }

        /* ── Hero ── */
        .hero {
            margin-top: 60px;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(1.8rem, 5vw, 2.6rem);
            font-weight: 300;
            line-height: 1.25;
            color: #e8f0fa;
            letter-spacing: -.01em;
        }

        .hero h1 strong {
            font-weight: 600;
        }

        .hero p {
            margin-top: 16px;
            font-size: .92rem;
            color: rgba(180, 210, 240, 0.6);
            line-height: 1.65;
            font-weight: 300;
        }

        .hero p span {
            font-weight: 500;
            color: rgba(180, 210, 240, .85);
        }

        /* ── Orb ── */
        .orb-section {
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .orb-wrap {
            position: relative;
            width: 138px;
            height: 138px;
        }

        /* Outer glow rings */
        .orb-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1.5px solid rgba(60, 130, 210, 0.3);
            animation: ring-pulse 3s ease-in-out infinite;
        }

        .orb-ring:nth-child(2) {
            inset: -10px;
            border-color: rgba(60, 130, 210, 0.15);
            animation-delay: .5s;
        }

        .orb-ring:nth-child(3) {
            inset: -20px;
            border-color: rgba(60, 130, 210, 0.07);
            animation-delay: 1s;
        }

        @keyframes ring-pulse {

            0%,
            100% {
                opacity: .7;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.03);
            }
        }

        /* Orb button */
        #orbBtn {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background:
                radial-gradient(ellipse 70% 60% at 38% 35%, rgba(90, 160, 255, 0.18), transparent),
                radial-gradient(circle at 50% 50%, #0c2545 0%, #060f20 70%);
            box-shadow:
                0 0 0 1.5px rgba(80, 140, 240, 0.4),
                0 0 30px rgba(40, 100, 200, 0.25),
                inset 0 0 20px rgba(30, 80, 170, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: box-shadow .3s;
        }

        #orbBtn:hover {
            box-shadow:
                0 0 0 2px rgba(80, 150, 255, 0.6),
                0 0 45px rgba(40, 110, 220, 0.45),
                inset 0 0 25px rgba(30, 90, 200, 0.2);
        }

        #orbBtn:active {
            transform: scale(.97);
        }

        /* Waveform bars inside the orb */
        .waveform-bars {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 40px;
        }

        .waveform-bars span {
            display: block;
            width: 3px;
            border-radius: 99px;
            background: linear-gradient(to top, rgba(100, 180, 255, 0.6), rgba(180, 220, 255, 0.9));
            transition: height .08s ease;
        }

        .orb-container.active #orbBtn {
            box-shadow:
                0 0 0 2px rgba(80, 160, 255, 0.7),
                0 0 55px rgba(40, 120, 240, 0.55),
                inset 0 0 30px rgba(30, 100, 220, 0.25);
        }

        /* Orb label inside button */
        #orbBtnLabel {
            font-size: .68rem;
            font-weight: 500;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: rgba(140, 190, 255, 0.8);
        }

        /* Status text below orb */
        #orbStatus {
            font-size: .88rem;
            font-weight: 400;
            color: rgba(180, 215, 255, 0.75);
            letter-spacing: .03em;
        }

        /* ── Bottom cards ── */
        .cards {
            width: 100%;
            max-width: 660px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 44px;
        }

        .card {
            background: rgba(6, 18, 40, 0.6);
            border: 1px solid rgba(50, 100, 180, 0.18);
            border-radius: 12px;
            backdrop-filter: blur(14px);
            padding: 16px 18px;
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: .64rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .14em;
            color: rgba(140, 185, 240, 0.7);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-title svg {
            width: 12px;
            height: 12px;
        }

        .card-dots {
            display: flex;
            gap: 4px;
        }

        .card-dots span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(100, 150, 220, 0.3);
        }

        .card-menu {
            display: flex;
            flex-direction: column;
            gap: 3px;
            cursor: pointer;
        }

        .card-menu span {
            display: block;
            width: 16px;
            height: 1.5px;
            background: rgba(140, 180, 230, 0.4);
        }

        /* Transcript card */
        #transcriptHeading {
            font-size: .92rem;
            font-weight: 500;
            color: #c8ddf4;
            margin-bottom: 8px;
        }

        #transcriptBody {
            min-height: 60px;
        }

        #transcriptHint {
            font-size: .74rem;
            color: rgba(120, 160, 210, 0.45);
            font-style: italic;
        }

        .transcript-entry {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            animation: fadein .3s ease;
        }

        @keyframes fadein {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
            }
        }

        .entry-avatar {
            font-size: .9rem;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .entry-bubble {}

        .entry-role {
            font-size: .64rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: rgba(130, 180, 240, 0.6);
            margin-bottom: 3px;
        }

        .entry-text {
            font-size: .82rem;
            color: #c0d8f0;
            line-height: 1.5;
        }

        .entry-time {
            font-size: .66rem;
            color: rgba(100, 150, 200, 0.4);
            margin-top: 3px;
        }

        /* Metrics card */
        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 0;
            border-bottom: 1px solid rgba(50, 100, 180, 0.1);
        }

        .metric-row:last-of-type {
            border-bottom: none;
        }

        .metric-key {
            font-size: .8rem;
            color: rgba(170, 205, 240, 0.7);
        }

        .metric-val {
            font-size: .8rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .metric-val.green {
            color: #4caf8a;
        }

        #metricLogs {
            margin-top: 10px;
        }

        #metricLogs p {
            font-size: .7rem;
            color: rgba(130, 175, 225, 0.55);
            line-height: 1.8;
            padding: 1px 0;
        }

        #metricLogs p::before {
            content: '> ';
            color: rgba(80, 140, 210, 0.4);
        }

        /* override the app.js that prepends '> ' — remove double > */

        /* ── Footer ── */
        footer {
            margin-top: 36px;
            margin-bottom: 28px;
            font-size: .72rem;
            color: rgba(120, 160, 210, 0.35);
            text-align: center;
        }

        /* ── Responsive ── */
        @media (max-width: 520px) {
            .cards {
                grid-template-columns: 1fr;
            }

            header {
                max-width: 100%;
            }

            .cards {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="wrapper">

        <!-- Header -->
        <header>
            <div class="header-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                </svg>
                EchoVerse
            </div>
            <span class="header-ver">v 2.0.1</span>
        </header>

        <!-- Hero -->
        <div class="hero">
            <h1>Voice intelligence,<br><strong>refined.</strong></h1>
            <p>
                Interact with your <span>agent naturally.</span><br>
                No commands, just conversation.
            </p>
        </div>

        <!-- Orb -->
        <div class="orb-section">
            <div class="orb-wrap" id="orbContainer">
                <div class="orb-ring"></div>
                <div class="orb-ring"></div>
                <div class="orb-ring"></div>
                <button id="orbBtn">
                    <div class="waveform-bars">
                        <span style="height:10px"></span>
                        <span style="height:18px"></span>
                        <span style="height:26px"></span>
                        <span style="height:34px"></span>
                        <span style="height:40px"></span>
                        <span style="height:34px"></span>
                        <span style="height:26px"></span>
                        <span style="height:18px"></span>
                        <span style="height:10px"></span>
                    </div>
                    <span id="orbBtnLabel">Activate</span>
                </button>
            </div>
            <div id="orbStatus">Ready</div>
        </div>

        <!-- Cards -->
        <div class="cards">

            <!-- Transcript -->
            <div class="card">
                <div class="card-head">
                    <div class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                        </svg>
                        Transcript
                    </div>
                    <div class="card-dots"><span></span><span></span></div>
                </div>
                <div id="transcriptHeading">Listening for input...</div>
                <div id="transcriptBody">
                    <p id="transcriptHint">Conversation history will appear here:.</p>
                </div>
            </div>

            <!-- Metrics -->
            <div class="card">
                <div class="card-head">
                    <div class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 11 12 14 22 4" />
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
                        </svg>
                        System Metrics
                    </div>
                    <div class="card-menu"><span></span><span></span><span></span></div>
                </div>

                <div class="metric-row">
                    <span class="metric-key">Latency</span>
                    <span class="metric-val" id="metricLatency">--</span>
                </div>
                <div class="metric-row">
                    <span class="metric-key">Status</span>
                    <span class="metric-val green" id="metricStatus">Standby</span>
                </div>

                <div id="metricLogs"></div>
            </div>

        </div>

        <!-- Footer -->
        <footer>Powered by EchoVerse Engine &nbsp;•&nbsp; Localhost Environment</footer>

    </div>

    <script src="app.js"></script>
</body>

</html>
