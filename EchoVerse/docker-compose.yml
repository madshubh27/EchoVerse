version: '3.8'

services:
  # --- Infrastructure ---
  postgres:
    image: postgres:15-alpine
    container_name: ev-postgres
    environment:
      POSTGRES_DB: echoverse
      POSTGRES_USER: echoverse
      POSTGRES_PASSWORD: echoverse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echoverse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ev-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: ev-otel
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "9090:9090"   # Prometheus metrics
    volumes:
      - ./otel-config.yml:/etc/otelcol/config.yaml

  # --- Application Services ---
  token-proxy:
    build: ./token-proxy
    container_name: ev-token-proxy
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  echoverse-api:
    build: ./echoverse-api
    container_name: ev-api
    ports:
      - "8001:8001"
    env_file: .env

  voice-agent:
    build: ./agent
    container_name: ev-agent
    env_file: .env
    depends_on:
      - echoverse-api
      - redis

  mcp-server:
    build: ./mcp-server
    container_name: ev-mcp
    ports:
      - "8002:8002"
    env_file: .env

volumes:
  pgdata:
